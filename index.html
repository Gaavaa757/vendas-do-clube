<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Vendas do Clube</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f6f7f4;--cd:#fff;--tx:#1b2a1f;--mu:#667;--ac:#1d6b3a;--bd:#dde3da}
@media(prefers-color-scheme:dark){:root{--bg:#141a16;--cd:#1d261f;--tx:#e8efe9;--mu:#9ab;--ac:#4cbf78;--bd:#2d3a30}}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}main{max-width:960px;margin:auto;padding:16px}
h1{font-size:22px;margin:0 0 12px}h2{font-size:16px;margin:0 0 10px}.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.kpi b{display:block;font-size:22px;color:var(--ac)}.kpi span,.mu{color:var(--mu);font-size:13px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.bar{height:8px;background:var(--bd);border-radius:6px;min-width:70px}.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
button,input,select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--cd);color:var(--tx)}
button{cursor:pointer;background:var(--ac);color:#fff;border:0}button.s{background:var(--bd);color:var(--tx)}input[type=number]{width:70px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--bd)}
</style></head><body><main><h1>🏕️ Vendas do Clube</h1><div id="app"><p class="mu">Carregando…</p></div></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,collectionGroup,doc,getDoc,addDoc,setDoc,updateDoc,deleteDoc,onSnapshot,serverTimestamp,writeBatch,getDocs,query,orderBy,deleteField} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// ====== CONFIGURE AQUI (Firebase > Configurações do projeto > Seus apps > Config) ======
const firebaseConfig={apiKey:'AIzaSyA1ambasThG3l5E8sr8MOWg_w8BR44yxIc',authDomain:'vendas-do-clube.firebaseapp.com',projectId:'vendas-do-clube',appId:'1:982243284562:web:2696e22ec17cb439be318b'};
// =======================================================================================
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb),app=document.getElementById('app');
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const $=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a)x.startsWith('on')?e[x]=a[x]:e.setAttribute(x,a[x]);k.flat().forEach(c=>e.append(c));return e};
const ts=s=>s.createdAt?.toDate?.()||new Date();
const fmt=d=>d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const ok=async p=>{try{return await p}catch(e){alert('Erro: '+e.message);throw e}};
const token=new URLSearchParams(location.search).get('t');

/* ---------- VISÃO DO MEMBRO (link pessoal ?t=ID) ---------- */
async function memberStart(){
  const mref=doc(db,'members',token);let M,products=[],sales=[];
  try{const s=await getDoc(mref);if(!s.exists())throw 0;M=s.data()}catch{app.replaceChildren($('p',{},'Link inválido. Peça um novo ao diretor.'));return}
  const render=()=>{
    const P=Object.fromEntries(products.map(p=>[p.id,p])),sold={},goal=M.goals||{};
    sales.forEach(s=>sold[s.productId]=(sold[s.productId]||0)+s.qty);
    const tot=sales.reduce((t,s)=>t+s.qty*(P[s.productId]?.price||0),0);
    app.replaceChildren($('div',{class:'card'},$('h2',{},'Olá, '+M.name+'!'),$('div',{class:'kpi'},$('b',{},brl(tot)),$('span',{},'total vendido por você'))));
    products.forEach(p=>{const q=sold[p.id]||0,g=goal[p.id]||0,qi=$('input',{type:'number',min:'1',value:'1'});
      app.append($('div',{class:'card'},$('div',{class:'row'},$('b',{},p.name),$('span',{class:'mu'},brl(p.price)),$('span',{class:'tag'},q+(g?' / '+g:'')+' vendidos')),
        g?$('div',{class:'bar'},$('i',{style:'width:'+Math.min(100,q/g*100)+'%'})):'',
        $('div',{class:'row',style:'margin-top:10px'},qi,$('button',{onclick:async()=>{const n=Math.floor(+qi.value);if(n<1||n>1000)return alert('Quantidade inválida');
          await ok(addDoc(collection(mref,'sales'),{productId:p.id,qty:n,createdAt:serverTimestamp()}))}},'Registrar venda'))))});
    const t=$('table',{},$('tr',{},...['Quando','Produto','Qtd','Valor',''].map(h=>$('th',{},h))));
    sales.forEach(s=>t.append($('tr',{},$('td',{},fmt(ts(s))),$('td',{},P[s.productId]?.name||'?'),$('td',{},String(s.qty)),$('td',{},brl(s.qty*(P[s.productId]?.price||0))),
      $('td',{},$('button',{class:'s',onclick:async()=>{if(confirm('Apagar este registro?'))await ok(deleteDoc(doc(mref,'sales',s.id)))}},'✕')))));
    app.append($('div',{class:'card'},$('h2',{},'Minhas vendas'),$('div',{class:'sc'},t)));
  };
  onSnapshot(mref,s=>{if(s.exists()){M=s.data();render()}});
  onSnapshot(query(collection(db,'products'),orderBy('name')),s=>{products=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  onSnapshot(query(collection(mref,'sales'),orderBy('createdAt','desc')),s=>{sales=s.docs.map(d=>({id:d.id,...d.data()}));render()});
}

/* ---------- VISÃO DO ADMIN ---------- */
const D={products:[],members:[],sales:[]};let tm;const later=()=>{clearTimeout(tm);tm=setTimeout(adminRender,150)};
function adminListen(){
  onSnapshot(collection(db,'products'),s=>{D.products=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name));later()},e=>alert(e.message));
  onSnapshot(collection(db,'members'),s=>{D.members=s.docs.map(d=>({id:d.id,...d.data()}));later()},e=>alert(e.message));
  onSnapshot(collectionGroup(db,'sales'),s=>{D.sales=s.docs.map(d=>({id:d.id,ref:d.ref,memberId:d.ref.parent.parent.id,...d.data()}));later()},e=>alert(e.message));
}
async function delSales(f){const b=D.sales.filter(f);for(let i=0;i<b.length;i+=400){const w=writeBatch(db);b.slice(i,i+400).forEach(s=>w.delete(s.ref));await w.commit()}}
function adminRender(){
  const {products,members,sales}=D,P=Object.fromEntries(products.map(p=>[p.id,p]));
  const sold=(m,p)=>sales.filter(s=>s.memberId===m&&s.productId===p).reduce((t,s)=>t+s.qty,0);
  const goal=(m,p)=>members.find(x=>x.id===m)?.goals?.[p]||0;
  const val=m=>products.reduce((t,p)=>t+sold(m,p.id)*p.price,0),gv=m=>products.reduce((t,p)=>t+goal(m,p.id)*p.price,0);
  const TV=members.reduce((t,m)=>t+val(m.id),0),TG=members.reduce((t,m)=>t+gv(m.id),0),TU=sales.reduce((t,s)=>t+s.qty,0);
  app.replaceChildren($('div',{class:'row'},$('span',{class:'mu'},'Admin: '+auth.currentUser.email),$('button',{class:'s',onclick:()=>signOut(auth).then(()=>location.reload())},'Sair')),
   $('div',{class:'card grid'},...[[brl(TV),'Total vendido'],[TU,'Unidades'],[brl(TG),'Meta total'],[TG?Math.round(TV/TG*100)+'%':'—','Meta atingida'],[members.length,'Pessoas']].map(([v,l])=>$('div',{class:'kpi'},$('b',{},String(v)),$('span',{},l)))));
  // ranking
  const t=$('table',{},$('tr',{},$('th',{},'Pessoa'),$('th',{},'Grupo'),...products.map(p=>$('th',{},p.name+' (vend/meta)')),$('th',{},'Total'),$('th',{},'Progresso')));
  [...members].sort((a,b)=>val(b.id)-val(a.id)).forEach(m=>{const g=gv(m.id);
    t.append($('tr',{},$('td',{},m.name),$('td',{},$('span',{class:'tag'},m.role)),...products.map(p=>$('td',{},sold(m.id,p.id)+' / '+goal(m.id,p.id))),$('td',{},brl(val(m.id))),$('td',{},$('div',{class:'bar'},$('i',{style:'width:'+(g?Math.min(100,val(m.id)/g*100):0)+'%'})))))});
  app.append($('div',{class:'card'},$('h2',{},'Ranking (tempo real)'),$('div',{class:'sc'},t)));
  // últimas vendas
  const l=$('table',{},$('tr',{},...['Quando','Pessoa','Produto','Qtd','Valor',''].map(h=>$('th',{},h))));
  [...sales].sort((a,b)=>ts(b)-ts(a)).slice(0,30).forEach(s=>l.append($('tr',{},$('td',{},fmt(ts(s))),$('td',{},members.find(m=>m.id===s.memberId)?.name||'?'),$('td',{},P[s.productId]?.name||'?'),$('td',{},String(s.qty)),$('td',{},brl(s.qty*(P[s.productId]?.price||0))),
    $('td',{},$('button',{class:'s',onclick:async()=>{if(confirm('Apagar venda?'))await ok(deleteDoc(s.ref))}},'✕')))));
  app.append($('div',{class:'card'},$('h2',{},'Últimas vendas lançadas'),$('div',{class:'sc'},l)));
  // produtos
  const pn=$('input',{placeholder:'Produto'}),pp=$('input',{type:'number',step:'0.01',placeholder:'Valor R$'}),pc=$('div',{class:'card'},$('h2',{},'Produtos'),
    $('div',{class:'row'},pn,pp,$('button',{onclick:async()=>{if(pn.value.trim()&&+pp.value>0)await ok(addDoc(collection(db,'products'),{name:pn.value.trim(),price:+pp.value}))}},'Adicionar')));
  products.forEach(p=>pc.append($('div',{class:'row'},$('span',{},p.name+' — '+brl(p.price)),$('button',{class:'s',onclick:async()=>{if(confirm('Remover produto e suas vendas?')){await ok(delSales(s=>s.productId===p.id));await ok(deleteDoc(doc(db,'products',p.id)))}}},'Remover'))));
  app.append(pc);
  // pessoas e metas
  const mn=$('input',{placeholder:'Nome'}),mr=$('select',{},$('option',{value:'desbravador'},'Desbravador'),$('option',{value:'diretoria'},'Diretoria')),
  mc=$('div',{class:'card'},$('h2',{},'Pessoas, links e metas (quantidade por produto)'),$('div',{class:'row'},mn,mr,$('button',{onclick:async()=>{if(mn.value.trim())await ok(addDoc(collection(db,'members'),{name:mn.value.trim(),role:mr.value,goals:{}}))}},'Adicionar pessoa')));
  [...members].sort((a,b)=>a.name.localeCompare(b.name)).forEach(m=>{const link=location.origin+location.pathname+'?t='+m.id;mc.append($('hr'));
    mc.append($('div',{class:'row'},$('b',{},m.name),$('span',{class:'tag'},m.role),$('button',{class:'s',onclick:()=>navigator.clipboard.writeText(link).then(()=>alert('Link copiado!'))},'Copiar link'),
      $('button',{class:'s',onclick:async()=>{if(confirm('Remover '+m.name+' e todas as vendas?')){await ok(delSales(s=>s.memberId===m.id));await ok(deleteDoc(doc(db,'members',m.id)))}}},'Remover')));
    const r=$('div',{class:'row'});products.forEach(p=>{const i=$('input',{type:'number',min:'0',value:String(goal(m.id,p.id))});
      i.onchange=()=>{const q=Math.max(0,Math.floor(+i.value)||0);ok(updateDoc(doc(db,'members',m.id),{['goals.'+p.id]:q||deleteField()}))};r.append($('label',{class:'mu'},p.name+' ',i))});mc.append(r)});
  app.append(mc);
}
function loginForm(){
  const e=$('input',{type:'email',placeholder:'E-mail'}),p=$('input',{type:'password',placeholder:'Senha'});
  app.replaceChildren($('div',{class:'card'},$('h2',{},'Entrar (admin)'),$('div',{class:'row'},e,p,
    $('button',{onclick:()=>signInWithEmailAndPassword(auth,e.value,p.value).catch(x=>alert('Não foi possível entrar: '+x.code))},'Entrar'),
    $('button',{class:'s',onclick:()=>e.value?sendPasswordResetEmail(auth,e.value).then(()=>alert('E-mail para criar/trocar senha enviado.')).catch(x=>alert(x.code)):alert('Digite o e-mail')},'Esqueci a senha'))));
}
if(token)memberStart();
else{let started=false;onAuthStateChanged(auth,u=>{if(!u)return loginForm();if(!started){started=true;app.replaceChildren($('p',{class:'mu'},'Carregando…'));adminListen()}})}
</script></body></html>
